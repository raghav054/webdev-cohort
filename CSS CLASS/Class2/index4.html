<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Unit</title>

    <style>
        div {
            height: 200px;
            width: 100px;
            padding: 20px;
            border: 10px solid chocolate;
        }

        #Raghav {
            margin-bottom: 30px;
            width: 80%;    /* Relative unit */
        }

        #raghav-inner {
            width: 80%;     /* Relative unit */
            height: 50px;
        }

        #RG {
            margin-top: 20px;
        }
    </style>

</head>

<body>
    <div id="Raghav">Raghav
        <div id="raghav-inner"></div>
    </div>
    <div id="RG">RG</div>
</body>

</html>
