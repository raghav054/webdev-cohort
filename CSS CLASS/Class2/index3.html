<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Modal</title>

    <style>
        *{                                 /* '*' => means select all element and follow under this style */
            box-sizing: border-box;  
          /* using this total size of box  will be 100 (include all padding etc)*/
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            width: 100px;
            padding: 20px;
            border: 10px solid chocolate;
        }

        #Raghav{
            margin-bottom: 30px;
        }

        #RG{
            margin-top: 20px;
            /* margin always overlapping, so gratest no. margin will apply bitween div (see in inspect) */
        }

    </style>

</head>
<body>
    <div id="Raghav">Raghav</div>
    <div id="RG">RG</div>
</body>
</html>
