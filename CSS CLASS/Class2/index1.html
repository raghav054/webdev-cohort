<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        .parent{
            border: 2px solid;

            display: grid;
            grid-template-rows: repeat(4, 60px);  /* 4 time 60px repeat*/
            grid-template-columns: repeat(6, 60px);
            gap: 10px;
        }

        .child{
            border: 2px dashed;
        }

        .item-1{
            grid-row-start: 1;
            grid-row-end: 3;

            grid-column-start: 1;
            grid-column-end: 4;
            /* grid-area: 1 / 1 / 3 / 4; */
        }

        .item-5{                  /* control perticuler area */
            /* grid-row-start: 4;
            grid-row-end: 5;

            grid-column-start: 4;
            grid-column-end: 5; */
                                            /* grid-row: start / end */
            /* grid-row: 4 / 5;
            grid-column: 4 / 5; */

            /* grid-area: r-start / col-start / row-end / col-end ; */
            grid-area: 4 / 4 / 5 / 5;

        }

        .item-4{
            grid-column-start: 2;
            /* grid-column-end: span 4; */
            /* grid-column-end: span grid-template-columns; */
            grid-column-end: -1;   /*for start to number of tamplate column*/
            grid-template-areas: h h h h;
        }
    </style>

</head>
<body>
    <div class="parent">
        <div class="child item-1">Item 1</div>
        <div class="child">Item 2</div>
        <div class="child">Item 3</div>
        <div class="child item-4">Item 4</div>
        <div class="child item-5">Item 5</div>
    </div>
</body>
</html>
