<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>

    <style>
        .p1 {
            font-size: 14px;
            background-color: lightblue;
            height: 80vh;
            width: 80vw;
        }

        .p2 {
            font-size: 7px;
        }

        p {
            font-size: 2em;
        }

        #my-element{
            position: absolute;
            top: 200px;
            left: 100px;
        }

    </style>

</head>

<body>
    <div class="p1">
        <p>Paragraph 1</p>
        <p id="my-element">Paragraph 2</p>
        <p>Paragraph 3</p>
    </div>
    <div class="p2">
        <p>P 4</p>
        <p>P 4</p>
        <p>P 4</p>
        <p>P 4</p>
        <p>P 4</p>
        <p>P 4</p>
    </div>
</body>

</html>
