<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Direction Property</title>

    <style>
        div{
            border: 1px solid #232222;
            /* padding: 15px; */
        }

        .parent{
            height: 250px;

            display: flex;
            flex-direction: column;
            /* it's direction is by default row-wise  */
            justify-content: end;
            align-items: start;
        }

        .child{
            height: 50px;


        }

    </style>
</head>
<body>
    <div class="parent">
        <div id="child-1" class="child">Item 1</div>
        <div id="child-2" class="child">Item 2</div>
        <div id="child-3" class="child">Item 3</div>
        <div id="child-4" class="child">Item 4</div>
    </div>
</body>
</html>
