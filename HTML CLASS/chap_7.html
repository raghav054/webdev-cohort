<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 7</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0c0a0a;
        }

        form {
            background-color: #246adb;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="password"], input[type="tel"], textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #24af4e;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
    
</head>
<body>
    <h1>Create form using HTML</h1>
    <form action="raghav.com">
        <label for="Phone">Phone Number</label>
        <input type="tel" id="Phone" name="Phone" pattern="[0-9]+" required>
        <button type="Submit">Submit</button>
        <br>

        <label for="Comments">Comments</label>
        <textarea name="Comments" name="Comments" rows="4"></textarea>
        <br>

        <label for="Password">Password</label>
        <input type="Password" id="Password" name="Password" pattern=".{8,}" required title="Password must be atleast 8 characters long"> 
    </form>
</body>
</html>
