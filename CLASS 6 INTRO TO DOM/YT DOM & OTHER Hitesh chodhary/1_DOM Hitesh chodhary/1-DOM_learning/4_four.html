<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur Code</title>
</head>
<body style = "background-Color: #212121; color: #fff">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    //*Add
    // create a func for add element
    function addLanguage(langName) {
        const li = document.createElement("li");
        li.innerHTML = `${langName}`
        document.querySelector(".language").
        appendChild(li);
    }
    addLanguage("python");
    addLanguage("typescript");           // it isn't optimise solution bcz when we append child so it traverse from top to bottem element and in the last add new element
    
    // optimisize way to create
    function addOptiLanguage(langName){
        const li = document.createElement('li');
        // const addText = document.createTextNode(langName)
        // li.appendChild(addText);
        li.appendChild(document.createTextNode(langName));

        document.querySelector('.language').
        appendChild(li);

    }
    addLanguage("golang"); 

    // *Edit
    const secondLang = document.querySelector("li:nth-child(2)")
    // secondLang.innerHTML = 'Ruby';

    // second method
    const newli = document.createElement('li');
    newli.textContent = 'Ruby'         // abhi hava mai hai
    secondLang.replaceWith(newli);

    //third method
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>CSS</li>';

    //*remove
    const lastLang = document.querySelector("li:last-child")
    lastLang.remove();
</script>
</html>
