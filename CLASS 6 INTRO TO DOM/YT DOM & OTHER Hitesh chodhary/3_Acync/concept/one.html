<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log('Raghav');
    // }, 2000)


    // const sayRaghav = function(){
    //     console.log('i am Raghav');
    // }
    // setTimeout(sayRaghav, 10000);  // give reference


    const changeText = function(){
        document.querySelector('h1').
        innerHTML = 'learning best series of JS';
        
    }
    const changeMe = setTimeout(changeText, 5000);      // setTimeOut
    //clearTimeout(changeMe);   //but we wanna run this on event
    document.querySelector('#stop').
    addEventListener('click', function(){
        clearTimeout(changeMe);               // clearTimeOut
        console.log('STOPPED');
        
    })
</script>
</html>




<!-- handler, timeout
handler => function without name or callback -->
