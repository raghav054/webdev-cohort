<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">
    Value	State	Description
0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr = new XMLHttpRequest()         // make object of XMLHttpRequest method
    xhr.open('GET', requestUrl)            // open(method(get,post,put,payload) and string) // for sending request
    //console.log(xhr.readyState);
    xhr.onreadystatechange = function(){           // for continuously changing state
        console.log(xhr.readyState);
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText)         // for getting response (converting string to json(object))
            //console.log(this.responseText);      // this for current context
            console.log(typeof data);
            console.log(data);
            console.log(data.followers);
            
        }
    }
    xhr.send();                             // for calling open
</script>
</html>
